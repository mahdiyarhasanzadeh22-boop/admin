<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل درخواست‌های همکاری | مهدیار استودیو</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{font-family:Vazirmatn,Tahoma,sans-serif;color:#eaf4ed;background:#0f1712;--surface:#17211b;--surface-2:#1d2b23;--line:#ffffff18;--green:#45c979;--gold:#e0a868;--muted:#b9c8bd;--danger:#ff8f98}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#1a5435 0,transparent 36%),#0f1712;color:var(--ink);color:#eaf4ed}.shell{width:min(1400px,calc(100% - 32px));margin:auto;padding:28px 0 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;margin-bottom:18px;border:1px solid var(--line);border-radius:18px;background:#17211bcc;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#24844c,#0b3319);font-weight:800}.eyebrow{font-size:12px;color:var(--gold);font-weight:700}.title{margin:3px 0 0;font-size:clamp(20px,3vw,30px)}.actions,.filters{display:flex;gap:10px;flex-wrap:wrap}.btn,.input,.select{font:inherit}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 15px;color:#fff;background:var(--surface-2);cursor:pointer;font-weight:700}.btn-primary{background:linear-gradient(135deg,#2b9e5e,#135029);border-color:transparent}.btn:hover{transform:translateY(-1px)}.panel{padding:20px;border:1px solid var(--line);border-radius:18px;background:#17211bd9;box-shadow:0 18px 50px #0003}.login{max-width:520px;margin:12vh auto}.label{display:block;margin-bottom:8px;color:var(--muted);font-size:13px}.input,.select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;color:#eaf4ed;background:#0f1712;outline:none}.input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px #45c97922}.login .btn{width:100%;margin-top:14px}.notice{min-height:20px;color:var(--danger);font-size:13px}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.metric strong{display:block;color:var(--green);font-size:25px}.metric span{font-size:12px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.select{width:auto;min-width:150px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:960px;border-collapse:collapse;font-size:13px}th,td{padding:13px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold);background:#1d2b23}td{color:#d9e4dc}tr:last-child td{border-bottom:0}.row-select{min-width:120px}.empty{padding:34px;text-align:center;color:var(--muted)}@media(max-width:700px){.shell{width:min(100% - 20px,600px);padding-top:12px}.topbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.summary{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.select{width:100%}.panel{padding:14px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><span class="mark">م</span><div><div class="eyebrow">مهدیار استودیو</div><h1 class="title">درخواست‌های همکاری</h1></div></div><div class="actions"><button class="btn" id="refresh" type="button">به‌روزرسانی</button><button class="btn" id="export" type="button">خروجی CSV</button><button class="btn hidden" id="logout" type="button">خروج</button></div></header>
<section class="panel login" id="login"><label class="label" for="token">کلید مدیریت</label><input class="input" id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><button class="btn btn-primary" id="connect" type="button">ورود به پنل</button><p class="notice" id="loginError"></p></section>
<section class="hidden" id="dashboard"><div class="summary"><div class="metric"><strong id="total">۰</strong><span>کل درخواست‌ها</span></div><div class="metric"><strong id="newCount">۰</strong><span>جدید</span></div><div class="metric"><strong id="reviewed">۰</strong><span>در حال بررسی</span></div><div class="metric"><strong id="done">۰</strong><span>تکمیل‌شده</span></div></div><section class="panel"><div class="toolbar"><div class="filters"><input class="input" id="search" type="search" placeholder="جست‌وجو در درخواست‌ها" aria-label="جست‌وجو در درخواست‌ها" style="max-width:320px"><select class="select" id="category"><option value="all">همه دسته‌ها</option><option>عمومی</option><option>پوستر</option><option>هویت بصری</option><option>شبکه‌های اجتماعی</option></select><select class="select" id="status"><option value="all">همه وضعیت‌ها</option><option>جدید</option><option>در حال بررسی</option><option>تکمیل‌شده</option></select></div><span class="eyebrow" id="updated"></span></div><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نام و شهر</th><th>تماس</th><th>پروژه</th><th>بودجه</th><th>دسته</th><th>وضعیت</th><th>توضیحات</th></tr></thead><tbody id="rows"></tbody></table><div class="empty hidden" id="empty">درخواستی پیدا نشد.</div></div><p class="notice" id="actionError"></p></section></section>
</main>
<script>
(function(){'use strict';
var api=(location.protocol==='file:'?'http://localhost:3001':location.origin)+'/api/requests',token='',rows=[],fa='۰۱۲۳۴۵۶۷۸۹';
function q(id){return document.getElementById(id)}
function faNum(value){return String(value).replace(/\d/g,function(d){return fa[d]})}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function adminHeaders(extra){return Object.assign({'Authorization':'Bearer '+token},extra||{})}
function parseResponse(response){return response.json().then(function(data){if(!response.ok||!data.ok)throw Error(data.error||'درخواست انجام نشد.');return data})}
function load(){if(!token)return;fetch(api,{headers:adminHeaders()}).then(parseResponse).then(function(data){rows=Array.isArray(data.rows)?data.rows:[];q('login').classList.add('hidden');q('dashboard').classList.remove('hidden');q('logout').classList.remove('hidden');q('loginError').textContent='';render()}).catch(function(error){q('loginError').textContent=error.message})}
function filtered(){var category=q('category').value,status=q('status').value,query=q('search').value.trim().toLocaleLowerCase();return rows.filter(function(row){var text=[row.full_name,row.phone,row.email,row.city,row.project_type,row.budget_range,row.description].join(' ').toLocaleLowerCase();return(category==='all'||row.category===category)&&(status==='all'||row.status===status)&&(!query||text.indexOf(query)!==-1)})}
function render(){var list=filtered();q('total').textContent=faNum(rows.length);q('newCount').textContent=faNum(rows.filter(function(row){return row.status==='جدید'}).length);q('reviewed').textContent=faNum(rows.filter(function(row){return row.status==='در حال بررسی'}).length);q('done').textContent=faNum(rows.filter(function(row){return row.status==='تکمیل‌شده'}).length);q('updated').textContent='آخرین به‌روزرسانی: '+new Date().toLocaleTimeString('fa-IR');q('empty').classList.toggle('hidden',list.length>0);q('rows').innerHTML=list.map(function(row){return '<tr><td dir="ltr">'+esc(new Date(row.created_at).toLocaleString('fa-IR'))+'</td><td><strong>'+esc(row.full_name)+'</strong><br><small>'+esc(row.city)+'</small></td><td dir="ltr">'+esc(row.phone)+'<br>'+esc(row.email)+'</td><td>'+esc(row.project_type)+'</td><td>'+esc(row.budget_range)+'</td><td><select class="select row-category" data-id="'+esc(row.id)+'"><option '+(row.category==='عمومی'?'selected':'')+'>عمومی</option><option '+(row.category==='پوستر'?'selected':'')+'>پوستر</option><option '+(row.category==='هویت بصری'?'selected':'')+'>هویت بصری</option><option '+(row.category==='شبکه‌های اجتماعی'?'selected':'')+'>شبکه‌های اجتماعی</option></select></td><td><select class="select row-status" data-id="'+esc(row.id)+'"><option '+(row.status==='جدید'?'selected':'')+'>جدید</option><option '+(row.status==='در حال بررسی'?'selected':'')+'>در حال بررسی</option><option '+(row.status==='تکمیل‌شده'?'selected':'')+'>تکمیل‌شده</option></select></td><td>'+esc(row.description)+'</td></tr>'}).join('')}
function update(id,category,status){return fetch(api,{method:'POST',headers:adminHeaders({'Content-Type':'application/json'}),body:JSON.stringify({action:'update',id:id,category:category,status:status})}).then(parseResponse)}
function exportCsv(){var fields=['created_at','full_name','phone','email','city','project_type','budget_range','proposed_price_toman','preferred_contact','description','status','category'];var csv=[fields.join(',')].concat(filtered().map(function(row){return fields.map(function(field){return '"'+String(row[field]||'').replace(/"/g,'""')+'"'}).join(',')})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='requests.csv';a.click();URL.revokeObjectURL(a.href)}
q('connect').addEventListener('click',function(){token=q('token').value.trim();q('loginError').textContent='';if(token)load()});q('token').addEventListener('keydown',function(event){if(event.key==='Enter')q('connect').click()});q('refresh').addEventListener('click',load);window.setInterval(function(){if(token&&document.visibilityState==='visible')load()},10000);q('export').addEventListener('click',exportCsv);q('category').addEventListener('change',render);q('status').addEventListener('change',render);q('search').addEventListener('input',render);q('logout').addEventListener('click',function(){token='';rows=[];q('token').value='';q('dashboard').classList.add('hidden');q('login').classList.remove('hidden');q('logout').classList.add('hidden');q('loginError').textContent='';q('actionError').textContent=''});q('rows').addEventListener('change',function(event){var control=event.target;if(!control.dataset.id)return;var row=rows.find(function(item){return String(item.id)===String(control.dataset.id)});if(!row)return;var oldCategory=row.category,oldStatus=row.status;if(control.classList.contains('row-category'))row.category=control.value;else row.status=control.value;q('actionError').textContent='';update(row.id,row.category,row.status).then(render).catch(function(error){row.category=oldCategory;row.status=oldStatus;render();q('actionError').textContent=error.message})});
})();
</script>
</body>
</html>
